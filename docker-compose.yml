services:
  mysql:
    image: mysql:8.4
    container_name: customer-crud-practice-mysql
    environment:
      MYSQL_DATABASE: customer_crud_practice
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    image: customer-crud-api-practice:1.0.0
    container_name: customer-crud-practice-app
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/customer_crud_practice
      SPRING_DATASOURCE_USERNAME: app_user
      SPRING_DATASOURCE_PASSWORD: app_password
    ports:
      - "8080:8080"

volumes:
  mysql_data: