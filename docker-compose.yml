services:
  mysql:
    image: mysql:8.4
    container_name: customer-crud-practice-mysql
    environment:
      MYSQL_DATABASE: customer_crud_practice
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: